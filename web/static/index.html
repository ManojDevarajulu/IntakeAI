<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake AI — Clinical Referral IDP & Clinician Review Terminal</title>
  <meta name="description" content="Production Document AI for Ambulatory Referrals with Conformal Risk Calibration, CMS Invariant Checking, and HL7 FHIR R4 Export." />

  <!-- Fonts: Literata (Clinical Serif) & Inter (Clean Sans) from CURA UI / Heidi Health Design -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Literata"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            cura: {
              bg: '#fcf8f6',
              surface: '#ffffff',
              dark: '#220c0c',
              darkHover: '#381616',
              accent: '#8c78e1',
              border: '#eae0dc',
              hairline: '#f0e8e4',
              hover: '#f6efeb',
              text: '#1a1a1a',
              textMuted: '#6b7280',
              emerald: '#10b981',
              rose: '#e11d48',
              amber: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for zero-build execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f7f1ed;
      color: #1a1a1a;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #dfd4cf;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- React App Component -->
  <script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
