name: Intake AI CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python tests/test_clinical_verifier.py
          python tests/test_schema_integrity.py
          python tests/test_synth_generator.py
          python tests/test_phase3_pipeline.py
          python tests/test_web_service.py

      - name: Run Empirical Conformal Benchmark
        run: |
          python src/eval_runner.py
